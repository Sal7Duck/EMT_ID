name: emt-id
channels: [conda-forge, bioconda]
dependencies:
  - python=3.10
  - numpy
  - scipy
  - pandas
  - h5py
  - matplotlib
  - seaborn
  - scikit-learn
  - statsmodels
  - anndata
  - scanpy
  - jupyterlab
  - pip
  - pip:
      - scikit-posthocs
      - gseapy
